<!doctype html>
<html lang="ar">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FireBrush Web</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="ui">
    <div id="menu-bar">
      <div class="menu" data-menu="file">File</div>
      <div class="menu" data-menu="edit">Edit</div>
      <div class="menu" data-menu="window">Window</div>
      <div class="menu" data-menu="sculpt">Sculpt</div>
    </div>
    <div id="tips">إصبع واحد: نقش / خلفية = دوران · إصبعان: تحريك/تكبير</div>
  </div>
  <div id="menu-submenus">
    <div class="submenu" id="file-menu">
      <button data-action="new">New</button>
      <button data-action="import">Import</button>
      <button data-action="export">Export</button>
      <button data-action="fix">Fix</button>
    </div>
    <div class="submenu" id="edit-menu">
      <button data-action=\"undo\">Undo</button>
      <button data-action=\"redo\">Redo</button>
      <hr style=\"margin:4px 0;border:none;border-top:1px solid #555\">
      <button data-action=\"add-cube\">Add Cube</button>
      <button data-action=\"add-sphere\">Add Sphere</button>
      <button data-action=\"add-cylinder\">Add Cylinder</button>
      <button data-action=\"add-torus\">Add Torus</button>
      <button data-action=\"add-cone\">Add Cone</button>
      <button data-action=\"add-pyramid\">Add Pyramid</button>
    </div>
    <div class="submenu" id="window-menu">
      <label><input type="checkbox" data-action="toggle-ui" checked> Show UI</label>
      <label><input type="checkbox" data-action="toggle-hotkeys"> Hotkeys (experimental)</label>
      <hr style="margin:4px 0;border:none;border-top:1px solid #555">
      <label>Camera Speed: <input type="range" data-action="camera-speed" min="0.001" max="0.1" step="0.001" value="0.005" style="width:80px"></label>
      <label>UI Scale: <input type="range" data-action="ui-scale" min="0.5" max="2" step="0.1" value="1" style="width:80px"></label>
      <hr style="margin:4px 0;border:none;border-top:1px solid #555">
      <label>BG Color: <input type="color" data-action="bg-color" value="#111111" style="width:40px;height:24px"></label>
      <label>UI Color: <input type="color" data-action="ui-color" value="#000000" style="width:40px;height:24px"></label>
    </div>
    <div class="submenu" id="sculpt-menu">
      <!-- sculpt-specific actions -->
    </div>
  </div>
  <div id="brush-controls">
    <label>فرشاة:
      <select id="brush-select"></select>
    </label>
    <div id="brush-settings"></div>
  </div>
  <canvas id="c"></canvas>
  <script type="module" src="app.js"></script>
</body>
</html>
